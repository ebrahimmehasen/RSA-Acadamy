name: Vercel deploy

# Deploys through the Vercel CLI so the project doesn't depend on the Vercel
# GitHub App being installed on this repo's owner account.
# Required repo secret: VERCEL_TOKEN

on:
  push:
    branches: [main, development]

concurrency:
  group: vercel-${{ github.ref }}
  cancel-in-progress: true

env:
  # identifiers, not credentials (also visible in .vercel/project.json)
  VERCEL_ORG_ID: team_MX35AMYPZzFEmurDlu2hV2Qx
  VERCEL_PROJECT_ID: prj_vxQ9CQids1HwepEzM7yW2ZFwReDA

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Pull Vercel settings
        run: npx --yes vercel@latest pull --yes --environment=${{ github.ref_name == 'main' && 'production' || 'preview' }} --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: npx --yes vercel@latest build ${{ github.ref_name == 'main' && '--prod' || '' }} --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy
        run: npx --yes vercel@latest deploy --prebuilt ${{ github.ref_name == 'main' && '--prod' || '' }} --token=${{ secrets.VERCEL_TOKEN }}
